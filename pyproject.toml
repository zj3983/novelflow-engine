[project]
name = "novel-autogrowth-engine"
version = "0.0.0"
description = "A story engine that evolves characters and generates chapters from an outline."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "pillow>=10.4",
  "pydantic>=2.0",
  "regex>=2026.7.19",
  "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.26",
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "real_review_gate: opt out of the default mock_orchestrator_review_gate fixture so the canonical hard gate runs for real (used in tests that exercise the bounded rewrite flow)",
]

[dependency-groups]
dev = [
    "fonttools>=4.63.0",
]
