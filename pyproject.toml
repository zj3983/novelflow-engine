[project]
name = "novel-autogrowth-engine"
version = "0.0.0"
description = "A story engine that evolves characters and generates chapters from an outline."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
