name: Feature request / 功能建议
description: 建议新的能力或工作流改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述当前限制或使用场景，而不仅是实现方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望 NovelFlow Engine 如何处理？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 可选方案
      description: 是否考虑过其他实现？
  - type: textarea
    id: compatibility
    attributes:
      label: 数据与兼容性影响
      description: 是否影响项目格式、章节状态、API、插件或迁移？
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue/PR，没有发现相同提案。
          required: true
