name: Temporary complete character PR1 patch

on:
  push:
    branches:
      - fix/character-card-taxonomy-quality

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/character-card-taxonomy-quality
          fetch-depth: 0
      - name: Apply patch script
        run: python .github/scripts/_tmp_complete_character_pr1.py
      - name: Validate Python and diff
        run: |
          python -m py_compile packages/story_core/character_profiles.py packages/story_core/outline_planning.py packages/story_core/models.py packages/story_core/outline_planning_generation.py
          git diff --check
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/story_core/character_profiles.py packages/story_core/outline_planning.py packages/story_core/models.py packages/story_core/outline_planning_generation.py
          git commit -m "feat: complete character depth and targeted repair [character-pr1-complete] [skip ci]"
          git push origin HEAD:fix/character-card-taxonomy-quality
