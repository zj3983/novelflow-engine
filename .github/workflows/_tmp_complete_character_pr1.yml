          from pathlib import Path

          def patch(path_name: str, edits: list[tuple[str, str, str]], marker: str) -> None:
              path = Path(path_name)
              text = path.read_text(encoding='utf-8')
              if marker in text:
                  print(f'{path_name}: already patched')
                  return
              for old, new, label in edits:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path_name}::{label}: expected 1 match, found {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')

